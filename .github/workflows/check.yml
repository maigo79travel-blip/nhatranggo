name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nhatranggo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d nhatranggo_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:local_ci_only@localhost:5432/nhatranggo_test
      APP_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build tools with production environment
        run: npm ci --include=dev
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: touch .env && npm run db:migrate && npm run db:seed && npm run admin:setup
      - run: npm run typecheck && npm run build
      - run: |
          npm start > /tmp/nhatranggo-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3001/api/health
      - run: npm run test:deployment && npm test && npm run test:cms && npm run test:modules && npm run test:home && npm run test:navigation && npm run test:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            test-results/
            /tmp/nhatranggo-server.log
          retention-days: 7
