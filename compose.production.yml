services:
  web:
    build: .
    image: nhatranggo:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      APP_URL: ${APP_URL:?Set the public HTTPS APP_URL}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
