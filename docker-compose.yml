services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_local
      POSTGRES_DB: booking_travel
    volumes:
      - booking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_travel"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  booking_pgdata:
